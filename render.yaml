services:
  - type: web
    name: mag-camp
    runtime: python
    plan: starter
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile - wsgi:app
    healthCheckPath: /health
    disk:
      name: mag-camp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/mhoms.db
      - key: UPLOAD_PATH
        value: /var/data/uploads
